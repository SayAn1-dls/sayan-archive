name: Auto Merge PRs
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  merge-all:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Merge all open PRs sequentially
        run: |
          MERGED=0
          FAILED=0
          for pr in $(gh pr list --state open --json number --jq '.[].number' | sort -n); do
            echo "Merging PR #$pr..."
            if gh pr merge $pr --squash --admin --delete-branch 2>&1; then
              MERGED=$((MERGED+1))
              echo "  Merged! ($MERGED total)"
            else
              echo "  Failed, trying with merge method..."
              if gh pr merge $pr --merge --admin --delete-branch 2>&1; then
                MERGED=$((MERGED+1))
                echo "  Merged with merge method! ($MERGED total)"
              else
                FAILED=$((FAILED+1))
                echo "  Both methods failed for PR #$pr"
              fi
            fi
            sleep 1
          done
          echo "Done: $MERGED merged, $FAILED failed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
